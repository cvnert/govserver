services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gov-rag-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: sqlite:////data/gov_rag.db
    volumes:
      - ./app/sources:/app/app/sources
      - ./data:/data
    expose:
      - "8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: gov-rag-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
