services:
  postgres:
    image: postgres:16-alpine
    container_name: gov-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gov_rag}
      POSTGRES_USER: ${POSTGRES_USER:-gov_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gov_rag_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gov-rag-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gov_rag}:${POSTGRES_PASSWORD:-gov_rag_password}@postgres:5432/${POSTGRES_DB:-gov_rag}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app/sources:/app/app/sources
    expose:
      - "8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: gov-rag-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
